[General]
; Enable trace-level logging (default: false, very spammy)
bVerboseLogging = false
bEditModeEnabled = true

[MapMarker]
bEnableMapMarker = true
bDynamicRotation = true
sMarkerNifPath = DragonBoardVR/Player.nif

[QuestMarker]
bEnableQuestMarker = true
fMarkerScale = 0.250000
fRotX = 90.000000
fRotY = 0.000000
fRotZ = 180.000000
sMarkerNifPath = meshes\DragonBoardVR\QuestMarker.nif
iLastFormID = 0
iLastQuestInstanceID = 0
iLastObjectiveInstanceID = 0
iLastObjectiveID = 0

[Activation]
; 0=Grip, 1=Trigger, 2=Thumbstick, 3=GripPlusThumbstick, 4=GripPlusY, 5=GripPlusB, 6=Hotkey8
iActivationMode = 6

[Combat]
bSlowTimeOnOpen = true
fSlowTimeMultiplier = 0.250000

[Interaction]
fRaycastMaxDistance = 100.000000
bEnableFingerTouch = true
fFingerTouchEnterDistance = 3.500000
fFingerTouchExitDistance = 5.000000
fHapticIntensity = 0.100000
fHapticDuration = 0.040000

[Debug]
bDebugMode = false
bFingerTrackingProbe = false
bFingerTrackingProbeMarkers = true
fFingerTrackingMarkerScale = 5.000000
fFingerTrackingTipExtension = 2.500000
fFingerTrackingProbeInterval = 0.250000

[FixedWidgets]
iCount = 0

[Wiggle]
bEnableWorldPinWiggle = true
fWigglePosAmplitude = 0.100000
fWiggleSideAmplitude = 0.040000
fWiggleRotAmplitude = 3.000000
fWiggleSpeed = 1.000000

[RmlUi]
iRenderWidth = 1280
iRenderHeight = 720
iMaxActiveFPS = 60
bRenderOnDirty = true
bEntranceAnimation = true
; animation preset: radial, reverse radial, Fade, leftToRight, rightToLeft
animationstyle = radial
fEntranceDuration = 0.250000
fEntranceFeather = 0.100000

